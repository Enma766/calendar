name: Construir Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Instalar dependencias (npm)
        run: npm install

      - name: 4. Construir la web (Vite)
        run: npm run build

      - name: 5. Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 6. Sincronizar Capacitor
        run: npx cap sync android

      - name: 7. Dar permisos al compilador
        run: chmod +x ./android/gradlew

      - name: 8. Construir el archivo APK
        run: cd android && ./gradlew assembleDebug
      
      - name: 9. Extraer versión del package.json
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: 10. Renombrar APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/MiCalendario-v${{ env.APP_VERSION }}.apk

      - name: 11. Subir el APK final
        uses: actions/upload-artifact@v4
        with:
          name: MiCalendario-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/MiCalendario-v${{ env.APP_VERSION }}.apk